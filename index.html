<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Delivery Store — Регистрация</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:       #0a0a0f;
    --surface:  #13131a;
    --border:   #2a2a3a;
    --accent:   #4f8cff;
    --accent2:  #7b5ea7;
    --green:    #3ecf8e;
    --red:      #ff5f5f;
    --text:     #e8e8f0;
    --muted:    #6b6b80;
    --font:     'Syne', sans-serif;
    --mono:     'DM Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ── Animated background ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 20%, rgba(79,140,255,.12) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 80% 80%, rgba(123,94,167,.10) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Grid dots ── */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    margin: 20px;
    box-shadow: 0 0 0 1px rgba(79,140,255,.08), 0 32px 80px rgba(0,0,0,.6);
    animation: cardIn .5s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 36px;
  }

  .logo-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .logo-name {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -.5px;
  }

  .logo-name span { color: var(--accent); }

  h1 {
    font-size: 26px;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -.5px;
    margin-bottom: 8px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  /* ── Steps ── */
  .step { display: none; }
  .step.active {
    display: block;
    animation: fadeUp .35s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    background: rgba(255,255,255,.04);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    margin-bottom: 20px;
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79,140,255,.15);
  }

  input::placeholder { color: var(--muted); }

  /* ── Code input ── */
  .code-input {
    font-size: 28px;
    font-weight: 500;
    letter-spacing: .3em;
    text-align: center;
    padding: 18px 16px;
  }

  button {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 12px;
    padding: 15px;
    color: #fff;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .02em;
    cursor: pointer;
    transition: opacity .2s, transform .15s;
    position: relative;
    overflow: hidden;
  }

  button:hover  { opacity: .9; }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  button .spinner {
    display: none;
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .6s linear infinite;
    margin: 0 auto;
  }
  button.loading .btn-text { display: none; }
  button.loading .spinner  { display: block; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Error / hint ── */
  .msg {
    font-size: 13px;
    border-radius: 10px;
    padding: 10px 14px;
    margin-top: -8px;
    margin-bottom: 16px;
    display: none;
  }
  .msg.error   { background: rgba(255,95,95,.1);  color: var(--red);   display: block; }
  .msg.success { background: rgba(62,207,142,.1); color: var(--green); display: block; }

  .hint {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 16px;
    line-height: 1.6;
  }

  .hint b { color: var(--text); }

  .resend {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    padding: 10px;
    margin-top: 10px;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
    transition: border-color .2s, color .2s;
  }
  .resend:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Success screen ── */
  .success-screen {
    text-align: center;
    padding: 12px 0;
  }

  .success-icon {
    width: 72px; height: 72px;
    background: rgba(62,207,142,.12);
    border: 1px solid rgba(62,207,142,.3);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 32px;
    margin: 0 auto 24px;
    animation: popIn .4s cubic-bezier(.34,1.56,.64,1) both .1s;
  }

  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .success-screen h2 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .success-screen p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── Progress dots ── */
  .progress {
    display: flex;
    gap: 6px;
    margin-bottom: 28px;
  }
  .dot {
    height: 3px;
    border-radius: 3px;
    flex: 1;
    background: var(--border);
    transition: background .3s;
  }
  .dot.done { background: var(--accent); }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">📦</div>
    <div class="logo-name">Delivery<span>Store</span></div>
  </div>

  <!-- Прогресс -->
  <div class="progress" id="progress">
    <div class="dot" id="dot1"></div>
    <div class="dot" id="dot2"></div>
  </div>

  <!-- ── Шаг 1: ввод TG ID ── -->
  <div class="step active" id="step1">
    <h1>Регистрация</h1>
    <p class="subtitle">Введите ваш Telegram ID — бот отправит код подтверждения.</p>

    <label for="tgid">Telegram ID</label>
    <input id="tgid" type="text" inputmode="numeric" placeholder="например: 123456789" />

    <div class="msg" id="msg1"></div>

    <button id="btnSend" onclick="sendCode()">
      <span class="btn-text">Получить код →</span>
      <div class="spinner"></div>
    </button>

    <p class="hint">Не знаете свой ID? Напишите <b>@userinfobot</b> в Telegram.</p>
  </div>

  <!-- ── Шаг 2: ввод кода ── -->
  <div class="step" id="step2">
    <h1>Введите код</h1>
    <p class="subtitle" id="codeHint">Мы отправили 6-значный код в Telegram.</p>

    <label for="code">Код подтверждения</label>
    <input id="code" class="code-input" type="text" inputmode="numeric"
           maxlength="6" placeholder="— — — — — —" oninput="autoVerify(this)" />

    <div class="msg" id="msg2"></div>

    <button id="btnVerify" onclick="verifyCode()">
      <span class="btn-text">Подтвердить →</span>
      <div class="spinner"></div>
    </button>

    <button class="resend" onclick="resend()">Отправить код повторно</button>
  </div>

  <!-- ── Успех ── -->
  <div class="step" id="step3">
    <div class="success-screen">
      <div class="success-icon">✅</div>
      <h2>Добро пожаловать!</h2>
      <p>Вы успешно зарегистрированы в <b>Delivery Store</b>.<br/>Приятного использования! 🚀</p>
    </div>
  </div>
</div>

<script>
  // ← Замени на адрес своего бэкенда
  const API = "http://localhost:8000";

  let currentTgId = "";

  function setStep(n) {
    document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
    document.getElementById("step" + n).classList.add("active");
    // обновляем точки
    for (let i = 1; i <= 2; i++) {
      document.getElementById("dot" + i).classList.toggle("done", i < n);
    }
    if (n === 3) document.getElementById("progress").style.display = "none";
  }

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = "msg " + type;
  }
  function clearMsg(id) {
    const el = document.getElementById(id);
    el.className = "msg";
  }

  function setLoading(btnId, loading) {
    document.getElementById(btnId).classList.toggle("loading", loading);
    document.getElementById(btnId).disabled = loading;
  }

  async function sendCode() {
    clearMsg("msg1");
    const tgId = document.getElementById("tgid").value.trim();
    if (!tgId || !/^\d+$/.test(tgId)) {
      showMsg("msg1", "Введите корректный Telegram ID (только цифры).", "error");
      return;
    }
    currentTgId = tgId;
    setLoading("btnSend", true);

    try {
      const res = await fetch(API + "/send-code", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tg_id: tgId }),
      });
      const data = await res.json();

      if (!res.ok) {
        if (data.detail === "already_registered") {
          showMsg("msg1", "Этот Telegram ID уже зарегистрирован.", "error");
        } else {
          showMsg("msg1", "Не удалось отправить код. Проверьте ID и попробуйте снова.", "error");
        }
        return;
      }

      document.getElementById("codeHint").textContent =
        `Код отправлен на аккаунт ${tgId} в Telegram.`;
      setStep(2);
      setTimeout(() => document.getElementById("code").focus(), 300);

    } catch {
      showMsg("msg1", "Ошибка соединения с сервером.", "error");
    } finally {
      setLoading("btnSend", false);
    }
  }

  function autoVerify(input) {
    input.value = input.value.replace(/\D/g, "");
    if (input.value.length === 6) verifyCode();
  }

  async function verifyCode() {
    clearMsg("msg2");
    const code = document.getElementById("code").value.trim();
    if (code.length !== 6) {
      showMsg("msg2", "Введите 6-значный код.", "error");
      return;
    }
    setLoading("btnVerify", true);

    try {
      const res = await fetch(API + "/verify-code", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tg_id: currentTgId, code }),
      });
      const data = await res.json();

      if (!res.ok) {
        const msgs = {
          wrong_code: "Неверный код. Попробуйте ещё раз.",
          expired:    "Код истёк. Запросите новый.",
          no_code:    "Сначала запросите код.",
        };
        showMsg("msg2", msgs[data.detail] || "Ошибка. Попробуйте снова.", "error");
        return;
      }

      setStep(3);
    } catch {
      showMsg("msg2", "Ошибка соединения с сервером.", "error");
    } finally {
      setLoading("btnVerify", false);
    }
  }

  async function resend() {
    document.getElementById("code").value = "";
    clearMsg("msg2");
    setStep(1);
    // сразу отправляем снова если ID уже введён
    if (currentTgId) {
      document.getElementById("tgid").value = currentTgId;
      await sendCode();
    }
  }

  // Enter по полям
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    if (document.getElementById("step1").classList.contains("active")) sendCode();
    if (document.getElementById("step2").classList.contains("active")) verifyCode();
  });
</script>
</body>
</html>
