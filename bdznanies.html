<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>База Знаний — Гангстерский Мир</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --red: #c0152a;
  --red2: #e8192f;
  --red3: #ff3347;
  --dark: #0a0a0a;
  --dark2: #111111;
  --dark3: #1a1a1a;
  --dark4: #222222;
  --white: #ffffff;
  --gray: #aaaaaa;
  --gray2: #666666;
  --border: rgba(255,255,255,0.07);
  --border-red: rgba(192,21,42,0.3);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--white);min-height:100vh;overflow-x:hidden}

/* ---- NOISE OVERLAY ---- */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.4}

/* ---- HEADER ---- */
.header{position:sticky;top:0;z-index:100;background:rgba(10,10,10,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-red)}
.header-inner{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0}
.logo-icon{width:36px;height:36px;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:18px;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--white);line-height:1}
.logo-sub{font-size:9px;color:var(--red3);letter-spacing:3px;text-transform:uppercase;font-family:'Oswald',sans-serif;font-weight:300}
.header-search{flex:1;max-width:480px;position:relative}
.header-search input{width:100%;background:var(--dark3);border:1px solid var(--border);border-radius:4px;padding:9px 16px 9px 40px;font-size:14px;color:var(--white);font-family:'Inter',sans-serif;outline:none;transition:border-color 0.2s}
.header-search input::placeholder{color:var(--gray2)}
.header-search input:focus{border-color:var(--red)}
.header-search .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--gray2);font-size:14px}
.header-right{margin-left:auto;font-family:'Oswald',sans-serif;font-size:12px;color:var(--gray2);letter-spacing:1px;text-transform:uppercase;white-space:nowrap}

/* ---- HERO ---- */
.hero{position:relative;overflow:hidden;padding:60px 24px 50px;text-align:center;background:linear-gradient(180deg,rgba(192,21,42,0.08) 0%,transparent 100%)}
.hero::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:600px;height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent)}
.hero-tag{display:inline-block;font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--red3);border:1px solid var(--border-red);padding:4px 16px;border-radius:2px;margin-bottom:20px}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(48px,8vw,96px);letter-spacing:4px;line-height:0.9;color:var(--white);margin-bottom:16px}
.hero h1 span{color:var(--red)}
.hero p{font-size:15px;color:var(--gray);max-width:480px;margin:0 auto 36px;line-height:1.6}
.hero-stats{display:flex;justify-content:center;gap:40px;flex-wrap:wrap}
.hero-stat{text-align:center}
.hero-stat-num{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--red3);letter-spacing:2px;display:block;line-height:1}
.hero-stat-label{font-size:11px;color:var(--gray2);letter-spacing:1px;text-transform:uppercase;font-family:'Oswald',sans-serif}

/* ---- MAIN LAYOUT ---- */
.main{max-width:1200px;margin:0 auto;padding:40px 24px 80px;display:grid;grid-template-columns:240px 1fr;gap:32px}
@media(max-width:768px){.main{grid-template-columns:1fr}.sidebar{display:none}}

/* ---- SIDEBAR ---- */
.sidebar{position:sticky;top:80px;height:fit-content}
.sidebar-title{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--gray2);margin-bottom:12px;padding-left:4px}
.cat-list{display:flex;flex-direction:column;gap:2px}
.cat-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:4px;cursor:pointer;transition:all 0.15s;border:1px solid transparent;font-family:'Inter',sans-serif;font-size:13px;color:var(--gray);text-decoration:none}
.cat-item:hover{background:var(--dark3);color:var(--white);border-color:var(--border)}
.cat-item.active{background:rgba(192,21,42,0.15);color:var(--white);border-color:var(--border-red)}
.cat-item .cat-icon{font-size:16px;width:20px;text-align:center}
.cat-item .cat-count{margin-left:auto;font-size:11px;background:var(--dark4);padding:2px 7px;border-radius:10px;color:var(--gray2)}
.cat-item.active .cat-count{background:rgba(192,21,42,0.3);color:var(--red3)}
.sidebar-divider{height:1px;background:var(--border);margin:16px 0}

/* ---- CONTENT ---- */
.content-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:gap}
.content-title{font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;letter-spacing:1px}
.content-title span{color:var(--red)}
.results-count{font-size:12px;color:var(--gray2);font-family:'Oswald',sans-serif;letter-spacing:1px;text-transform:uppercase}

/* ---- ARTICLES GRID ---- */
.articles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.article-card{background:var(--dark2);border:1px solid var(--border);border-radius:6px;padding:20px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;text-decoration:none;display:block}
.article-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform 0.25s}
.article-card:hover{border-color:var(--border-red);background:var(--dark3);transform:translateY(-2px)}
.article-card:hover::before{transform:scaleX(1)}
.article-card.featured{border-color:var(--border-red);background:linear-gradient(135deg,rgba(192,21,42,0.08) 0%,var(--dark2) 60%)}
.article-card.featured::before{transform:scaleX(1)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:8px}
.card-icon{font-size:24px;line-height:1}
.card-badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:2px;font-family:'Oswald',sans-serif;letter-spacing:1px;text-transform:uppercase;flex-shrink:0}
.badge-new{background:rgba(232,25,47,0.2);color:var(--red3);border:1px solid rgba(232,25,47,0.3)}
.badge-hot{background:rgba(255,150,0,0.15);color:#ff9600;border:1px solid rgba(255,150,0,0.25)}
.badge-tip{background:rgba(0,180,120,0.15);color:#00c87a;border:1px solid rgba(0,180,120,0.25)}
.card-title{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;color:var(--white);line-height:1.3;margin-bottom:8px}
.card-desc{font-size:12px;color:var(--gray);line-height:1.5;margin-bottom:14px}
.card-footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-tag{font-size:10px;padding:2px 8px;border-radius:2px;background:var(--dark4);color:var(--gray2);border:1px solid var(--border);font-family:'Oswald',sans-serif;letter-spacing:0.5px}

/* ---- FEATURED ARTICLE (big) ---- */
.article-card.big{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
@media(max-width:600px){.article-card.big{grid-template-columns:1fr}}
.big-content{}
.big-label{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--red3);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.big-label::before{content:'';display:inline-block;width:20px;height:1px;background:var(--red)}
.big-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,4vw,44px);letter-spacing:2px;line-height:1;margin-bottom:12px;color:var(--white)}
.big-desc{font-size:13px;color:var(--gray);line-height:1.6;margin-bottom:16px}
.big-stats{display:flex;gap:16px;flex-wrap:wrap}
.big-stat{font-family:'Oswald',sans-serif;font-size:12px;color:var(--gray2);display:flex;align-items:center;gap:4px}
.big-stat span{color:var(--white);font-weight:600}
.big-visual{background:var(--dark4);border-radius:4px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:80px;height:160px;position:relative;overflow:hidden}
.big-visual::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,rgba(192,21,42,0.15),transparent 70%)}

/* ---- ACCORDION / FULL ARTICLE ---- */
.article-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.article-overlay.open{display:flex}
.article-modal{background:var(--dark2);border:1px solid var(--border-red);border-radius:8px;max-width:700px;width:100%;max-height:85vh;overflow-y:auto;position:relative}
.modal-header{padding:28px 28px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--dark2);z-index:1}
.modal-close{position:absolute;top:20px;right:20px;background:var(--dark4);border:1px solid var(--border);color:var(--gray);width:32px;height:32px;border-radius:4px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.modal-close:hover{background:var(--red);border-color:var(--red);color:var(--white)}
.modal-tag{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--red3);margin-bottom:8px}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(24px,4vw,36px);letter-spacing:2px;color:var(--white);line-height:1;padding-right:40px}
.modal-body{padding:24px 28px 28px}
.modal-section{margin-bottom:24px}
.modal-section h3{font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--red3);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border-red)}
.modal-section p{font-size:13px;color:var(--gray);line-height:1.7;margin-bottom:8px}
.info-box{background:var(--dark3);border:1px solid var(--border);border-left:3px solid var(--red);border-radius:0 4px 4px 0;padding:12px 16px;font-size:13px;color:rgba(255,255,255,0.8);line-height:1.6;margin-bottom:12px}
.warn-box{background:rgba(255,100,0,0.08);border:1px solid rgba(255,100,0,0.2);border-left:3px solid #ff6400;border-radius:0 4px 4px 0;padding:12px 16px;font-size:13px;color:rgba(255,255,255,0.8);line-height:1.6;margin-bottom:12px}
.tip-box{background:rgba(0,180,120,0.08);border:1px solid rgba(0,180,120,0.2);border-left:3px solid #00c87a;border-radius:0 4px 4px 0;padding:12px 16px;font-size:13px;color:rgba(255,255,255,0.8);line-height:1.6;margin-bottom:12px}
.steps{list-style:none;counter-reset:steps}
.steps li{counter-increment:steps;display:flex;gap:12px;margin-bottom:12px;font-size:13px;color:var(--gray);line-height:1.6}
.steps li::before{content:counter(steps);flex-shrink:0;width:24px;height:24px;background:var(--red);color:var(--white);border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;margin-top:1px}
.cmd-list{display:flex;flex-direction:column;gap:6px}
.cmd-item{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;background:var(--dark3);border-radius:4px;border:1px solid var(--border)}
.cmd-code{font-family:'Courier New',monospace;font-size:12px;color:var(--red3);background:rgba(192,21,42,0.1);padding:2px 8px;border-radius:3px;white-space:nowrap;flex-shrink:0}
.cmd-desc{font-size:12px;color:var(--gray);line-height:1.5}
.reward-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.reward-item{background:var(--dark3);border:1px solid var(--border);border-radius:4px;padding:10px;text-align:center}
.reward-icon{font-size:20px;margin-bottom:4px}
.reward-val{font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;color:var(--white);display:block}
.reward-label{font-size:10px;color:var(--gray2);text-transform:uppercase;letter-spacing:1px}

/* ---- EMPTY ---- */
.empty{text-align:center;padding:60px 20px;color:var(--gray2)}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:0.5}
.empty-title{font-family:'Oswald',sans-serif;font-size:20px;color:var(--gray);margin-bottom:8px;letter-spacing:1px}

/* ---- SCROLLBAR ---- */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--dark)}
::-webkit-scrollbar-thumb{background:var(--red);border-radius:2px}

/* ---- ANIMATIONS ---- */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.article-card{animation:fadeUp 0.4s ease both}
.article-card:nth-child(1){animation-delay:0.05s}
.article-card:nth-child(2){animation-delay:0.1s}
.article-card:nth-child(3){animation-delay:0.15s}
.article-card:nth-child(4){animation-delay:0.2s}
.article-card:nth-child(5){animation-delay:0.25s}
.article-card:nth-child(6){animation-delay:0.3s}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a class="logo" href="#">
      <div class="logo-icon">🔫</div>
      <div>
        <div class="logo-text">Г·МИР</div>
        <div class="logo-sub">База Знаний</div>
      </div>
    </a>
    <div class="header-search">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Поиск по базе знаний...">
    </div>
    <div class="header-right" id="articleCount">— статей</div>
  </div>
</header>

<section class="hero">
  <div class="hero-tag">📚 Официальная документация</div>
  <h1>БАЗА<br><span>ЗНАНИЙ</span></h1>
  <p>Всё что нужно знать начинающему и опытному гангстеру. Команды, механики, гайды и советы.</p>
  <div class="hero-stats">
    <div class="hero-stat"><span class="hero-stat-num" id="statTotal">0</span><span class="hero-stat-label">Статей</span></div>
    <div class="hero-stat"><span class="hero-stat-num">6</span><span class="hero-stat-label">Категорий</span></div>
    <div class="hero-stat"><span class="hero-stat-num">∞</span><span class="hero-stat-label">Возможностей</span></div>
  </div>
</section>

<div class="main">
  <aside class="sidebar">
    <div class="sidebar-title">Категории</div>
    <div class="cat-list" id="catList"></div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-title">Фильтр</div>
    <div class="cat-list">
      <a class="cat-item" onclick="filterByBadge('new')" href="#"><span class="cat-icon">🆕</span> Новые</a>
      <a class="cat-item" onclick="filterByBadge('hot')" href="#"><span class="cat-icon">🔥</span> Популярное</a>
      <a class="cat-item" onclick="filterByBadge('tip')" href="#"><span class="cat-icon">💡</span> Советы</a>
    </div>
  </aside>

  <div>
    <div class="content-header">
      <div class="content-title" id="contentTitle">Все статьи</div>
      <div class="results-count" id="resultsCount"></div>
    </div>
    <div class="articles-grid" id="grid"></div>
  </div>
</div>

<div class="article-overlay" id="overlay" onclick="closeModal(event)">
  <div class="article-modal" id="modal">
    <div class="modal-header">
      <div class="modal-tag" id="mTag"></div>
      <div class="modal-title" id="mTitle"></div>
      <button class="modal-close" onclick="closeModalBtn()">✕</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<script>

  {

const CATS = ["Все", ...new Set(ARTICLES.map(a => a.cat))];
let activeCat = "Все";
let activeBadge = null;
let searchQuery = "";

function buildCats() {
  const el = document.getElementById('catList');
  CATS.forEach(cat => {
    const count = cat === "Все" ? ARTICLES.length : ARTICLES.filter(a => a.cat === cat).length;
    const a = document.createElement('a');
    a.className = 'cat-item' + (cat === activeCat ? ' active' : '');
    a.href = '#';
    a.innerHTML = `<span class="cat-icon">${catIcon(cat)}</span>${cat}<span class="cat-count">${count}</span>`;
    a.onclick = e => { e.preventDefault(); activeCat = cat; activeBadge = null; searchQuery = ""; document.getElementById('searchInput').value = ""; render(); updateCats(); };
    el.appendChild(a);
  });
}

function catIcon(cat) {
  return {Все:"📚",Старт:"🚀",Работа:"💪",Криминал:"🔪",Экономика:"💰",Прогресс:"📈",Социальное:"🤝"}[cat] || "📄";
}

function updateCats() {
  document.querySelectorAll('.cat-item').forEach((el, i) => {
    if (i < CATS.length) el.classList.toggle('active', CATS[i] === activeCat);
  });
}

function filterByBadge(badge) {
  activeBadge = badge; activeCat = "Все"; searchQuery = ""; document.getElementById('searchInput').value = ""; render(); updateCats();
}

function filtered() {
  let list = ARTICLES;
  if (activeCat !== "Все") list = list.filter(a => a.cat === activeCat);
  if (activeBadge) list = list.filter(a => a.badge === activeBadge);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(a => a.title.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q) || a.tags.some(t => t.includes(q)));
  }
  return list;
}

function render() {
  const grid = document.getElementById('grid');
  const list = filtered();
  document.getElementById('resultsCount').textContent = list.length + " статей";
  document.getElementById('contentTitle').innerHTML = activeCat === "Все" ? "Все статьи" : `<span>${catIcon(activeCat)}</span> ${activeCat}`;
  grid.innerHTML = '';
  if (!list.length) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🔍</div><div class="empty-title">Ничего не найдено</div><div>Попробуй другой запрос или категорию</div></div>';
    return;
  }
  list.forEach((a, i) => {
    const card = document.createElement('div');
    card.className = 'article-card' + (a.featured ? ' featured' : '');
    card.style.animationDelay = (i * 0.05) + 's';
    card.onclick = () => openModal(a);
    const badge = a.badge ? `<span class="card-badge badge-${a.badge}">${{new:'🆕 NEW',hot:'🔥 HOT',tip:'💡 TIP'}[a.badge]}</span>` : '';
    const tags = a.tags.map(t => `<span class="card-tag">${t}</span>`).join('');
    card.innerHTML = `
      <div class="card-top"><div class="card-icon">${a.icon}</div>${badge}</div>
      <div class="card-title">${a.title}</div>
      <div class="card-desc">${a.desc}</div>
      <div class="card-footer">${tags}</div>`;
    grid.appendChild(card);
  });
}

function openModal(a) {
  document.getElementById('mTag').textContent = a.cat.toUpperCase() + ' · ' + catIcon(a.cat);
  document.getElementById('mTitle').textContent = a.title;
  const body = document.getElementById('mBody');
  body.innerHTML = a.content.sections.map(s => renderSection(s)).join('');
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderSection(s) {
  if (s.type === 'heading') return `<div class="modal-section"><h3>${s.text}</h3></div>`.replace('</div>','');
  if (s.type === 'info') return `<div class="info-box">${s.text}</div>`;
  if (s.type === 'warn') return `<div class="warn-box">${s.text}</div>`;
  if (s.type === 'tip') return `<div class="tip-box">${s.text}</div>`;
  if (s.type === 'steps') return `<ul class="steps">${s.items.map(i => `<li>${i}</li>`).join('')}</ul>`;
  if (s.type === 'cmds') return `<div class="cmd-list">${s.items.map(([c,d]) => `<div class="cmd-item"><span class="cmd-code">${c}</span><span class="cmd-desc">${d}</span></div>`).join('')}</div>`;
  if (s.type === 'rewards') return `<div class="reward-grid">${s.items.map(([icon,val,label]) => `<div class="reward-item"><div class="reward-icon">${icon}</div><span class="reward-val">${val}</span><span class="reward-label">${label}</span></div>`).join('')}</div>`;
  return '';
}

function closeModal(e) { if (e.target === document.getElementById('overlay')) closeModalBtn(); }
function closeModalBtn() { document.getElementById('overlay').classList.remove('open'); document.body.style.overflow = ''; }

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  activeCat = "Все"; activeBadge = null; render(); updateCats();
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalBtn(); });

// Init
buildCats();
render();
document.getElementById('statTotal').textContent = ARTICLES.length;
document.getElementById('articleCount').textContent = ARTICLES.length + ' статей';

// Animate stat
let n = 0;
const interval = setInterval(() => {
  n += 1;
  document.getElementById('statTotal').textContent = n;
  if (n >= ARTICLES.length) clearInterval(interval);
}, 80);
</script>
